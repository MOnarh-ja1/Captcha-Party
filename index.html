<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover"><meta name="theme-color" content="#8579ff"><meta name="apple-mobile-web-app-capable" content="yes"><title>CAPTCHA PARTY</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html{touch-action:manipulation}body{margin:0;min-height:100dvh;padding:18px;background:radial-gradient(circle at 0 0,#ffbcd8,transparent 40%),radial-gradient(circle at 100% 5%,#b4d8ff,transparent 38%),linear-gradient(145deg,#fff3fb,#e8eeff);font:16px system-ui,-apple-system,sans-serif;color:#303452;overscroll-behavior:none}.app{max-width:540px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;font-weight:900;letter-spacing:1px}.head span{color:#ff6eaa}.ver{font-size:11px;background:#fff9;padding:8px 12px;border:1px solid white;border-radius:99px;color:#8e83a2}.panel{background:#fffffff0;border:1px solid white;border-radius:28px;padding:22px;box-shadow:0 18px 55px #7777aa20;animation:appear .35s both}.hidden{display:none!important}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}h1{font-size:clamp(35px,10vw,53px);line-height:1.02;letter-spacing:-2px;margin:12px 0}.eyebrow{color:#fa68ae;font-size:12px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.muted{color:#8288a7;line-height:1.55;font-size:14px}.hero{background:linear-gradient(130deg,#eee4ff,#ffe4f1);border-radius:24px;padding:24px 18px;text-align:center;margin:18px 0;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;width:90px;height:90px;border-radius:24px;transform:rotate(25deg);background:#fff8;right:-35px;top:-30px;animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(385deg)}}.hero svg{width:108px;height:108px;animation:float 2.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px) rotate(4deg)}}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}.stat{background:#f5f4ff;border-radius:16px;padding:13px;font-size:11px;color:#8c8aab;font-weight:800}.stat b{display:block;font-size:24px;color:#303452;margin-top:5px}.btn{font:inherit;font-weight:900;border:0;border-radius:17px;width:100%;padding:17px;cursor:pointer;touch-action:manipulation;transition:transform .13s,filter .13s;position:relative}.btn:active{transform:scale(.96);filter:brightness(.96)}.play{background:linear-gradient(120deg,#8173ff,#aa77ff);color:white;box-shadow:0 9px 20px #8975ff44}.shopbtn{background:linear-gradient(120deg,#ff77a9,#ffac78);color:white;margin-top:10px;box-shadow:0 9px 20px #ff8fab44}.back{background:#f0f1ff;color:#6259a0;margin-top:12px}.title-row{display:flex;justify-content:space-between;align-items:center;font-weight:800}.pill{font-size:12px;background:#f1eeff;padding:7px 11px;border-radius:20px}.bar{height:9px;border-radius:20px;background:#efebff;margin:15px 0;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,#ff80b3,#8173ff);transition:width .25s}.question{background:linear-gradient(130deg,#797bff,#ff83b7);color:white;padding:18px;border-radius:19px;margin-bottom:15px}.question small{font-size:12px;opacity:.94}.question strong{display:block;font-size:25px;margin-top:4px}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{aspect-ratio:1;min-width:0;position:relative;border:3px solid #e9eaff;border-radius:16px;background:linear-gradient(140deg,#e7f9ff,#ffe9f4);padding:6px;cursor:pointer;touch-action:manipulation;transition:transform .15s,border-color .15s}.tile:active{transform:scale(.93)}.tile.selected{border-color:#8078ff;background:#e8e2ff}.tile.selected:after{content:"✓";position:absolute;right:4px;top:4px;background:#8078ff;color:white;border-radius:50%;height:25px;width:25px;display:grid;place-items:center;font-weight:900;box-shadow:0 2px 5px #7777aa55}.tile svg{width:100%;height:100%;filter:drop-shadow(0 5px 3px #3b3b5920)}.status{min-height:35px;font-size:13px;font-weight:800;padding-top:14px;color:#8c8aab}.ok{color:#22aa81}.err{color:#f05478}.note{text-align:center;color:#9992af;font-size:12px;margin-top:14px}.empty{text-align:center;padding:35px 15px;background:#fff0fa;border-radius:24px}.empty .ico{font-size:46px;font-weight:1000;letter-spacing:-3px;color:#ff7bac}.spark{color:#fd99bd;font-size:20px;font-weight:900}.finish{text-align:center}
</style></head><body><div class="app"><div class="head"><div>CAPTCHA <span>PARTY</span></div><div class="ver">ALPHA 0.7</div></div>
<section class="panel" id="menu"><div class="eyebrow">Весёлая игра про капчи</div><div class="hero"><svg viewBox="0 0 120 120" aria-hidden="true"><rect x="10" y="9" width="100" height="100" rx="27" fill="#8075ff"/><rect x="26" y="26" width="68" height="68" rx="18" fill="white"/><path d="M42 59 55 72 81 45" fill="none" stroke="#55ca9b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>CAPTCHA<br>PARTY</h1><p class="muted">Докажи, что ты не робот!</p></div><div class="stats"><div class="stat">РЕКОРД<b id="best">0</b></div><div class="stat">УРОВНЕЙ<b>8</b></div></div><button class="btn play" id="start">ИГРАТЬ</button><button class="btn shopbtn" id="shop-open">МАГАЗИН</button></section>
<section class="panel hidden" id="game"><div class="title-row"><span class="eyebrow">ПРОВЕРКА</span><span class="pill" id="progress-text"></span></div><div class="bar"><div id="bar-fill"></div></div><div class="question"><small>Выберите все картинки, где есть</small><strong id="target"></strong></div><div class="tiles" id="tiles"></div><div class="status" id="status">Нажми на подходящие картинки.</div><button class="btn play" id="verify">ПРОВЕРИТЬ</button><button class="btn back" id="game-back">В МЕНЮ</button></section>
<section class="panel hidden" id="shop"><div class="eyebrow">МАГАЗИН</div><h1>Скоро!</h1><div class="empty"><div class="ico">SHOP</div><p class="muted">Товары появятся в следующих обновлениях.</p></div><button class="btn back" id="shop-back">В МЕНЮ</button></section>
<section class="panel hidden finish" id="finish"><div class="spark">★ ★ ★</div><h1>ТЫ ЧЕЛОВЕК!</h1><p class="muted" id="result"></p><button class="btn play" id="again">ИГРАТЬ СНОВА</button><button class="btn back" id="finish-back">В МЕНЮ</button></section><p class="note">HTML-игра · без регистрации и рекламы</p></div>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id);
const data=[['автобусы','bus',['bus','car','bus','tree','bus','bike','house','bus','car']],['кошки','cat',['cat','dog','cat','bird','cat','dog','house','cat','tree']],['велосипеды','bike',['bike','car','bike','tree','bike','bus','car','bike','house']],['деревья','tree',['tree','flower','tree','house','tree','flower','cat','tree','bus']],['дома','house',['house','tree','house','bus','house','car','flower','house','cat']],['машины','car',['car','bus','car','bike','car','tree','bus','car','dog']],['цветы','flower',['flower','tree','flower','bird','flower','house','tree','flower','car']],['птицы','bird',['bird','cat','bird','tree','bird','dog','house','bird','flower']]];
const arts={
bus:'<rect x="11" y="34" width="78" height="39" rx="10" fill="#ffae43"/><rect x="19" y="41" width="17" height="17" rx="3" fill="#a9e8ff"/><rect x="41" y="41" width="17" height="17" rx="3" fill="#a9e8ff"/><rect x="63" y="41" width="17" height="17" rx="3" fill="#a9e8ff"/><circle cx="29" cy="75" r="8" fill="#42577e"/><circle cx="70" cy="75" r="8" fill="#42577e"/>',
car:'<rect x="12" y="49" width="76" height="26" rx="10" fill="#6c83ff"/><path d="M29 50 38 32 H65 L76 50" fill="#a3edff" stroke="#6c83ff" stroke-width="4"/><circle cx="29" cy="77" r="8" fill="#455a8c"/><circle cx="72" cy="77" r="8" fill="#455a8c"/>',
bike:'<circle cx="24" cy="71" r="17" fill="none" stroke="#415b85" stroke-width="6"/><circle cx="77" cy="71" r="17" fill="none" stroke="#415b85" stroke-width="6"/><path d="M24 71 42 44 55 71 24 71 M42 44 H70 L77 71 M42 44 36 38 M69 42 H79" stroke="#48b9ee" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/>',
cat:'<path d="M20 40 24 17 44 31 Q50 28 56 31 L76 17 80 40 A36 36 0 1 1 20 40" fill="#ffb17b"/><circle cx="39" cy="52" r="5" fill="#35405e"/><circle cx="62" cy="52" r="5" fill="#35405e"/><path d="M46 65 Q50 70 54 65" fill="none" stroke="#35405e" stroke-width="4" stroke-linecap="round"/>',
dog:'<circle cx="50" cy="51" r="31" fill="#b98b68"/><ellipse cx="21" cy="43" rx="13" ry="24" fill="#8e684e"/><ellipse cx="79" cy="43" rx="13" ry="24" fill="#8e684e"/><circle cx="39" cy="49" r="4" fill="#333b56"/><circle cx="62" cy="49" r="4" fill="#333b56"/><ellipse cx="50" cy="65" rx="8" ry="6" fill="#333b56"/>',
tree:'<rect x="44" y="54" width="13" height="33" rx="4" fill="#ae7952"/><circle cx="49" cy="33" r="27" fill="#4dc995"/><circle cx="30" cy="52" r="20" fill="#62d6a2"/><circle cx="67" cy="51" r="21" fill="#48b88e"/>',
house:'<rect x="23" y="44" width="55" height="42" rx="4" fill="#ffd372"/><path d="M14 48 50 17 86 48" fill="#ff7999"/><rect x="43" y="58" width="15" height="28" rx="3" fill="#a67765"/><rect x="29" y="54" width="10" height="11" fill="#a7ecff"/>',
flower:'<path d="M50 51 V86" stroke="#41b991" stroke-width="7"/><path d="M49 76 Q21 56 22 77 Q32 90 49 76 M51 70 Q80 53 77 78 Q64 85 51 70" fill="#64d1a1"/><circle cx="50" cy="33" r="13" fill="#fa75b0"/><circle cx="32" cy="48" r="13" fill="#fa75b0"/><circle cx="68" cy="48" r="13" fill="#fa75b0"/><circle cx="40" cy="61" r="13" fill="#fa75b0"/><circle cx="60" cy="61" r="13" fill="#fa75b0"/><circle cx="50" cy="48" r="12" fill="#ffd66f"/>',
bird:'<ellipse cx="48" cy="54" rx="29" ry="24" fill="#79baff"/><circle cx="70" cy="36" r="19" fill="#79baff"/><path d="M82 39 99 46 82 51" fill="#ffbf5d"/><circle cx="76" cy="33" r="3.5" fill="#35405e"/><path d="M42 52 Q25 35 26 64 Q40 75 56 60" fill="#5e91f1"/>'
};
let level=0,points=0,errors=0,picked=new Set(),items=[];
function show(id){['menu','game','shop','finish'].forEach(s=>$(s).classList.toggle('hidden',s!==id))}
function record(){try{return Number(localStorage.getItem('cap-party-score')||0)}catch(e){return 0}}
function save(v){try{localStorage.setItem('cap-party-score',v)}catch(e){}}
$('best').textContent=record();
function shuffle(a){return a.map(v=>({v,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.v)}
function draw(){picked.clear();items=shuffle(data[level][2]);$('progress-text').textContent=(level+1)+' / '+data.length;$('bar-fill').style.width=(level/data.length*100)+'%';$('target').textContent=data[level][0];$('status').textContent='Нажми на подходящие картинки.';$('status').className='status';$('verify').disabled=false;const root=$('tiles');root.replaceChildren();items.forEach((it,i)=>{const b=document.createElement('button');b.type='button';b.className='tile';b.setAttribute('aria-label','Картинка '+(i+1));b.innerHTML='<svg viewBox="0 0 100 100" role="img" aria-hidden="true">'+arts[it]+'</svg>';b.onclick=()=>{if(picked.has(i))picked.delete(i);else picked.add(i);b.classList.toggle('selected',picked.has(i))};root.appendChild(b)})}
function start(){level=0;points=0;errors=0;draw();show('game')}
$('start').onclick=start;$('again').onclick=start;$('shop-open').onclick=()=>show('shop');$('shop-back').onclick=()=>show('menu');$('game-back').onclick=()=>show('menu');$('finish-back').onclick=()=>show('menu');
$('verify').onclick=()=>{const ok=items.every((it,i)=>picked.has(i)===(it===data[level][1]));if(!ok){errors++;$('status').textContent='Не совсем! Выбери другие карточки.';$('status').className='status err';return}points+=100;$('status').textContent='Правильно! +100 очков';$('status').className='status ok';$('verify').disabled=true;setTimeout(()=>{level++;if(level<data.length)draw();else{let best=Math.max(points,record());save(best);$('best').textContent=best;$('result').textContent=points+' очков · '+errors+' ошибок';show('finish')}},450)};
document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});document.addEventListener('gesturechange',e=>e.preventDefault(),{passive:false});document.addEventListener('contextmenu',e=>e.preventDefault());
})();
</script></body></html>
