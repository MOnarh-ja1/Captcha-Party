<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>COZY COFFEE</title><style>*{box-sizing:border-box;touch-action:manipulation;-webkit-user-select:none;user-select:none}body{margin:0;background:#222d28;color:#fff6e4;font:16px system-ui;display:flex;justify-content:center}main{width:min(100%,480px);min-height:100dvh;padding: max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}small{color:#b8c8b7;letter-spacing:2px}h1,h2,p{margin:0}h1{font-size:32px}button{border:0;border-radius:16px;padding:16px;background:#e8b779;color:#36281e;font:bold 16px system-ui;cursor:pointer}button:active{transform:scale(.96)}button:disabled{opacity:.4}.row{display:flex;gap:9px}.row>*{flex:1}.panel{background:#35443a;border-radius:20px;padding:15px}.scene{height:245px;position:relative;overflow:hidden;background:linear-gradient(#e8d4a9 0 66%,#ae7955 66%);border-radius:22px}.window{position:absolute;left:18px;top:16px;width:110px;height:110px;background:linear-gradient(#a4c3bc,#e8e0a6);border:8px solid #765840;border-radius:55px 55px 4px 4px}.window:after{content:'';position:absolute;left:45%;height:100%;width:6px;background:#765840}.shelf{position:absolute;right:20px;top:45px;width:145px;height:12px;background:#805a40;box-shadow:0 45px #805a40}.shelf:before{content:' ';position:absolute;bottom:12px;left:12px;width:22px;height:30px;background:#c27a50;border-radius:4px;box-shadow:38px 0 #87987c,76px 0 #fff0cb}.person{position:absolute;left:36%;bottom:54px;width:80px;height:116px;background:#74907d;border-radius:35px 35px 10px 10px;animation:bob 2s infinite ease-in-out}.head{position:absolute;left:14px;top:-40px;width:52px;height:58px;border-radius:45%;background:#dca67e;border-top:15px solid #674432}.head:after{content:'•  •';position:absolute;left:12px;top:9px;color:#40352a}.counter{position:absolute;bottom:0;height:75px;width:100%;background:#76503a;border-top:14px solid #d7a979}.cup{position:absolute;bottom:75px;right:45px;width:45px;height:43px;border-radius:4px 4px 15px 15px;background:#fff2d6;box-shadow:inset 0 -7px #d6c19e}.cup:after{content:'';position:absolute;right:-14px;top:7px;width:16px;height:19px;border:5px solid #fff2d6;border-radius:50%}.liquid{position:absolute;left:4px;right:4px;top:3px;height:8px;border-radius:50%;background:#71432b;opacity:0}.meter{height:8px;background:#1b2922;border-radius:9px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:#e8b779;transition:width .2s}.muted{color:#bdc9b9;font-size:13px}.toast{min-height:22px;color:#e8b779;text-align:center} @keyframes bob{50%{transform:translateY(-4px)}}#start{position:fixed;inset:0;background:#222d28;display:grid;place-content:center;text-align:center;gap:20px;padding:25px;z-index:9}#start[hidden]{display:none}</style><main><small>MPOL GAMES / SIMULATOR</small><h1>Cozy Coffee</h1><div class="row"><div class="panel"><small>КАССА</small><h2 id="cash">0 ₽</h2></div><div class="panel"><small>ГОСТИ</small><h2 id="served">0</h2></div></div><div class="scene"><div class="window"></div><div class="shelf"></div><div class="person" id="person"><div class="head"></div></div><div class="counter"></div><div class="cup"><div class="liquid" id="liquid"></div></div></div><div class="panel"><small>ЗАКАЗ ГОСТЯ</small><h2 id="order"></h2><p class="muted" id="recipe"></p><div class="meter"><i id="bar"></i></div></div><div class="row"><button onclick="add('coffee')">Кофе</button><button onclick="add('milk')">Молоко</button><button onclick="add('water')">Вода</button></div><div class="row"><button onclick="resetCup()">Очистить</button><button onclick="serve()">Подать заказ</button></div><p class="toast" id="msg"></p><div class="panel"><small>УЛУЧШЕНИЯ</small><p id="level"></p><button style="width:100%;margin-top:8px" id="upgrade" onclick="buy()">Улучшить кофейню</button></div></main><div id="start"><small>ТВОЯ МАЛЕНЬКАЯ КОФЕЙНЯ</small><h1>COZY COFFEE</h1><p>Готовь напитки, обслуживай гостей и развивай кофейню.</p><button onclick="document.getElementById('start').hidden=true">Играть</button></div><script>const el=id=>document.getElementById(id);let saved={};try{saved=JSON.parse(localStorage.getItem('cozy-coffee')||'{}')}catch(e){}let cash=Number(saved.cash)||0,served=Number(saved.served)||0,level=Number(saved.level)||1,parts=[];const recipes=[{name:'Эспрессо',parts:['coffee'],price:45},{name:'Латте',parts:['coffee','milk','milk'],price:85},{name:'Американо',parts:['coffee','water'],price:60},{name:'Капучино',parts:['coffee','milk'],price:75}];const names={coffee:'кофе',milk:'молоко',water:'вода'};let current=recipes[0];function save(){try{localStorage.setItem('cozy-coffee',JSON.stringify({cash,served,level}))}catch(e){}}function render(){el('cash').textContent=cash+' ₽';el('served').textContent=served;el('order').textContent=current.name+' · '+(current.price+10*(level-1))+' ₽';el('recipe').textContent=current.parts.map(x=>names[x]).join(' + ');el('bar').style.width=Math.min(100,parts.length/current.parts.length*100)+'%';el('liquid').style.opacity=parts.length?1:0;el('liquid').style.background=parts.includes('milk')?'#c99c74':'#71432b';el('level').textContent='Уровень '+level+' · +'+(level-1)*10+' ₽ за заказ';el('upgrade').textContent='Улучшить за '+level*150+' ₽';el('upgrade').disabled=cash<level*150}function add(x){if(parts.length>=5)return;parts.push(x);el('msg').textContent=parts.map(x=>names[x]).join(' + ');render()}function resetCup(){parts=[];el('msg').textContent='Чашка очищена';render()}function serve(){if(parts.slice().sort().join()!==current.parts.slice().sort().join()){el('msg').textContent='Не тот рецепт! Очисти чашку и попробуй снова.';return}let reward=current.price+10*(level-1);cash+=reward;served++;parts=[];el('msg').textContent='Отлично! +'+reward+' ₽';current=recipes[(served+Math.floor(Math.random()*recipes.length))%recipes.length];el('person').animate([{transform:'translateX(0)'},{transform:'translateX(-200px)',opacity:0},{transform:'translateX(200px)',opacity:0},{transform:'translateX(0)',opacity:1}],{duration:650});save();render()}function buy(){let cost=level*150;if(cash<cost)return;cash-=cost;level++;save();render();el('msg').textContent='Кофейня улучшена!'}render();</script></html>
