<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>MPOL Empire</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}body{margin:0;background:#10131c;color:#f6f8ff;font:15px system-ui}main{max-width:500px;margin:auto;padding: max(16px,env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}h1,h2,p{margin:0}small{color:#9ba8c0}header{display:flex;justify-content:space-between;align-items:center}button{font:inherit;color:inherit;border:0;cursor:pointer}button:active{transform:scale(.96)}button:disabled{opacity:.45;cursor:default}.hero{margin:16px 0;background:radial-gradient(ellipse at 50% 10%,#24445b,#1a2234 70%);border:1px solid #344459;border-radius:24px;padding:22px;text-align:center}.balance{font-size:42px;font-weight:850;letter-spacing:-2px;color:#e4ffb3}.rate{color:#a7e9ad;margin:5px}.city{height:130px;display:flex;align-items:flex-end;justify-content:center;gap:7px;padding:15px 12px 0;border-bottom:2px solid #51636b;overflow:hidden}.building{width:35px;background:repeating-linear-gradient(0deg,transparent 0 10px,#e9c77a 11px 14px,transparent 15px 20px),linear-gradient(90deg,#314e62,#547080);border:5px solid #385267;border-radius:4px 4px 0 0;transition:height .4s}.tap{display:block;margin:18px auto 10px;width:128px;height:128px;border-radius:50%;background:linear-gradient(135deg,#ebffb8,#8abf65);color:#243b26;font-size:55px;font-weight:900;box-shadow:0 8px 0 #4b7948,0 15px 36px #0005;position:relative}.tap:active{transform:translateY(5px);box-shadow:0 3px 0 #4b7948}.float{position:fixed;pointer-events:none;color:#e9ffb5;font-weight:900;animation:up .75s forwards;z-index:20}@keyframes up{to{transform:translateY(-75px);opacity:0}}.card{display:flex;gap:12px;align-items:center;background:#1c2434;border:1px solid #303c50;padding:13px;border-radius:18px;margin-top:10px}.art{width:48px;height:48px;display:grid;place-items:center;border-radius:12px;background:#344657;font-size:25px;flex-shrink:0}.info{flex:1;min-width:0}.info b{display:block}.info small{display:block;margin-top:4px}.buy{background:#c8eca0;color:#23391f;font-weight:800;border-radius:12px;padding:11px 13px;min-width:80px}.nav{position:fixed;bottom:0;left:0;right:0;background:#171e2c;border-top:1px solid #354052;display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));gap:5px}.nav button{width:120px;border-radius:13px;background:transparent;color:#aebad0;padding:13px 3px}.nav button.active{background:#35445a;color:#e4ffb3}#notice{min-height:20px;color:#d8efae;font-size:13px;text-align:center}.tag{background:#293a4a;padding:7px 12px;border-radius:30px;color:#c8eca0}.progress{height:7px;background:#354154;border-radius:9px;overflow:hidden;margin:10px 0}.progress i{display:block;background:#a5d67c;height:100%;transition:width .3s}.hidden{display:none}</style></head><body><main><header><div><small>MPOL GAMES</small><h2>EMPIRE</h2></div><span class="tag" id="rank">Новичок</span></header><section class="hero"><small>ТВОЙ КАПИТАЛ</small><div class="balance" id="money">$0</div><div class="rate" id="rate">+$0 / сек</div><div class="city" id="city"></div><button class="tap" id="tap" aria-label="Заработать">$</button><small id="power">+1 за нажатие</small><p id="notice"></p></section><section id="business"><h2>Твои бизнесы</h2><div id="shops"></div></section><section id="boosts" class="hidden"><h2>Улучшения</h2><div id="upgrades"></div></section><section id="stats" class="hidden"><h2>Достижения</h2><div id="achievements"></div></section></main><nav class="nav"><button class="active" data-tab="business">Бизнесы</button><button data-tab="boosts">Улучшения</button><button data-tab="stats">Достижения</button></nav><script>const $=x=>document.getElementById(x),defs=[['Автомат','▣',15,1],['Магазин','▤',100,6],['Автосервис','⚙',650,30],['Отель','▥',4000,160],['Завод','▦',25000,850],['IT-компания','▧',150000,4500],['Небоскрёб','▮',1000000,30000]];let s={money:0,total:0,clicks:0,power:1,owned:defs.map(()=>0),mult:1,time:Date.now()};try{let old=JSON.parse(localStorage.getItem('mpol-empire-v1'));if(old&&Array.isArray(old.owned)&&old.owned.length===defs.length)s={...s,...old}}catch(e){}const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.floor(n).toLocaleString('ru-RU');const income=()=>defs.reduce((sum,d,i)=>sum+d[3]*s.owned[i],0)*s.mult;const price=i=>Math.ceil(defs[i][2]*Math.pow(1.16,s.owned[i]));function earn(n){s.money+=n;s.total+=n}function save(){s.time=Date.now();try{localStorage.setItem('mpol-empire-v1',JSON.stringify(s))}catch(e){}}let offline=Math.floor(Math.min(14400,Math.max(0,(Date.now()-s.time)/1000))*income());if(offline>0){earn(offline);$('notice').textContent='Пока тебя не было: +$'+fmt(offline)}function card(icon,name,desc,cost,id){return '<div class="card"><div class="art">'+icon+'</div><div class="info"><b>'+name+'</b><small>'+desc+'</small></div><button class="buy" id="'+id+'">$'+fmt(cost)+'</button></div>'}function build(){ $('shops').innerHTML=defs.map((d,i)=>card(d[1],d[0],'',''+price(i),'b'+i)).join('');defs.forEach((d,i)=>$('b'+i).onclick=()=>{let p=price(i);if(s.money>=p){s.money-=p;s.owned[i]++;save();render()}});$('upgrades').innerHTML=card('✦','Сила клика','',50,'u0')+card('↗','Доход бизнеса','',250,'u1');$('u0').onclick=()=>{let p=50*s.power*s.power;if(s.money>=p){s.money-=p;s.power++;save();render()}};$('u1').onclick=()=>{let p=250*s.mult*s.mult;if(s.money>=p){s.money-=p;s.mult++;save();render()}};$('city').innerHTML=defs.map(()=>'<div class="building"></div>').join('')}function render(){ $('money').textContent='$'+fmt(s.money);$('rate').textContent='+$'+fmt(income())+' / сек';$('power').textContent='+$'+s.power+' за нажатие';$('rank').textContent=s.total>=1e6?'Магнат':s.total>=10000?'Предприниматель':s.total>=500?'Бизнесмен':'Новичок';defs.forEach((d,i)=>{let b=$('b'+i);b.textContent='$'+fmt(price(i));b.disabled=s.money<price(i);b.previousElementSibling.querySelector('small').textContent='Ур. '+s.owned[i]+' · +$'+fmt(d[3]*s.mult)+'/сек';$('city').children[i].style.height=(s.owned[i]?25+Math.min(95,Math.log2(s.owned[i]+1)*18+i*6):5)+'px';$('city').children[i].style.opacity=s.owned[i]?1:.2});[50*s.power*s.power,250*s.mult*s.mult].forEach((p,i)=>{let b=$('u'+i);b.textContent='$'+fmt(p);b.disabled=s.money<p;b.previousElementSibling.querySelector('small').textContent=i?'Множитель ×'+s.mult+' → ×'+(s.mult+1):'Сила '+s.power+' → '+(s.power+1)});if(!$('stats').classList.contains('hidden'))$('achievements').innerHTML=[['Первый капитал',s.total,100],['Мастер кликов',s.clicks,500],['Владелец бизнеса',s.owned.reduce((a,b)=>a+b,0),20],['Миллионер',s.total,1e6]].map(([n,v,g])=>'<div class="card"><div class="info"><b>'+n+(v>=g?' ✓':'')+'</b><div class="progress"><i style="width:'+Math.min(100,v/g*100)+'%"></i></div><small>'+fmt(v)+' / '+fmt(g)+'</small></div></div>').join('')}build();render();$('tap').onclick=e=>{earn(s.power);s.clicks++;let f=document.createElement('span');f.className='float';f.textContent='+$'+s.power;let r=$('tap').getBoundingClientRect();f.style.left=(e.clientX||r.left+r.width/2)+'px';f.style.top=(e.clientY||r.top+r.height/2)+'px';document.body.append(f);setTimeout(()=>f.remove(),760);render();save()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('active',x===b);$(x.dataset.tab).classList.toggle('hidden',x!==b)});render()});let last=Date.now();setInterval(()=>{let now=Date.now();earn(income()*Math.min(14400,(now-last)/1000));last=now;render()},250);setInterval(save,3000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pagehide',save);</script></body></html>
