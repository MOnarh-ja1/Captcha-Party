color:#aebad0;margin:10px 0}.marketrow{width:100%;text-align:left;background:#253347;border-radius:12px;padding:12px;margin:5px 0;display:flex;justify-content:space-between}.marketrow.selected{outline:1px solid #a5d67c}#chart{width:100%;margin-top:12px;background:#101827;border-radius:12px}#marketname{color:#a5d67c;text-align:center;margin-top:8px}html,body{height:100%;overflow:hidden}main{max-width:none;padding:0;height:100dvh;position:relative}header{position:fixed;z-index:3;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;pointer-events:none}header h2{font-size:14px}header small{font-size:9px}.tag{font-size:10px;padding:6px 8px}.capital{position:fixed;z-index:3;top:calc(max(12px,env(safe-area-inset-top)) + 42px);left:50%;transform:translateX(-50%);border:1px solid #829baf55;border-radius:20px;background:#152332dd;min-width:180px;padding:9px 18px;pointer-events:none;backdrop-filter:blur(12px)}.capital .balance{font-size:34px}.capital small{font-size:10px}.capital .rate{font-size:13px;margin:0}.hero,.hero.hidden{display:block;position:absolute;inset:0;margin:0;padding:0;border:0;border-radius:0;background:none;z-index:0}.world{position:absolute;inset:0;height:100%;width:100%;margin:0;border:0;border-radius:0}.worldhint{bottom:calc(90px + env(safe-area-inset-bottom));color:#fff;font-size:12px}.hero #power{position:absolute;bottom:calc(116px + env(safe-area-inset-bottom));left:0;right:0;pointer-events:none;text-shadow:0 1px 4px #000}.hero #notice{position:absolute;top:165px;left:0;right:0;pointer-events:none}.tap[hidden]{display:none}.nav{z-index:5;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border:1px solid #64768b66;border-radius:20px;background:#182637ed;backdrop-filter:blur(14px)}.nav button{font-size:12px;padding:14px 3px;max-width:none}.sheet{position:fixed;z-index:4;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));max-width:460px;margin:auto;max-height:48dvh;overflow-y:auto;background:#182433f5;box-shadow:0 12px 40px #0007;backdrop-filter:blur(16px);animation:slide .22s ease-out}.sheet h2{font-size:19px;margin-right:40px}.close{float:right;background:#34465a;border-radius:10px;width:32px;height:32px;font-size:23px}.card{padding:10px}.art{width:38px;height:38px}.float{font-size:22px;text-shadow:0 2px 4px #000}@keyframes slide{from{transform:translateY(22px);opacity:0}to{transform:translateY(0);opacity:1}}@media(prefers-reduced-motion:reduce){.sheet{animation:none}}</style></head><body><main><header><div><small>MPOL GAMES · V0.5.1</small><h2>EMPIRE 3D</h2></div><span class="tag" id="rank">Новичок</span></header><div class="capital"><small>ТВОЙ КАПИТАЛ</small><div class="balance" id="money">$0</div><div class="rate" id="rate">+$0 / сек</div></div><section class="hero" id="home"><div class="world" id="world"><canvas id="view" aria-label="Трёхмерный город"></canvas><div class="worldhint">Нажимай на свободное место · двигай пальцем для обзора</div></div><div id="city" style="display:none"></div><button hidden class="tap" id="tap" aria-label="Заработать">Заработать +$</button><small id="power">+1 за нажатие</small><p id="notice"></p></section><section id="business" class="hidden sheet"><button class="close" data-close>×</button><h2>Твои бизнесы</h2><div id="shops"></div></section><section id="boosts" class="hidden sheet"><button class="close" data-close>×</button><h2>Улучшения</h2><div id="upgrades"></div></section><section id="stats" class="hidden sheet"><button class="close" data-close>×</button><h2>Достижения</h2><div id="achievements"></div></section><section id="market" class="hidden sheet"><button class="close" data-close>×</button><h2>Биржа</h2><p class="explain">Учебный рынок вымышленных компаний. Графики демонстрируют изменение цен, без ставок и сделок.</p><div id="marketlist"></div><canvas id="chart" width="640" height="300"></canvas><p id="marketname"></p></section></main><nav class="nav"><button class="active" data-tab="home">Город</button><button data-tab="business">Бизнесы</button><button data-tab="boosts">Улучшения</button><button data-tab="market">Биржа</button><button data-tab="stats">Статистика</button></nav><script>const $=x=>document.getElementById(x),defs=[['Автомат','▣',15,1],['Магазин','▤',100,6],['Автосервис','⚙',650,30],['Отель','▥',4000,160],['Завод','▦',25000,850],['IT-компания','▧',150000,4500],['Небоскрёб','▮',1000000,30000]];let s={money:0,total:0,clicks:0,power:1,owned:defs.map(()=>0),mult:1,time:Date.now()};try{let old=JSON.parse(localStorage.getItem('mpol-empire-v1'));if(old&&Array.isArray(old.owned)&&old.owned.length===defs.length)s={...s,...old}}catch(e){}const fmt=n=>n>=1e9?(n/1e9).toFixed(2)+'B':n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e4?(n/1e3).toFixed(1)+'K':Math.floor(n).toLocaleString('ru-RU');const income=()=>defs.reduce((sum,d,i)=>sum+d[3]*s.owned[i],0)*s.mult;const price=i=>Math.ceil(defs[i][2]*Math.pow(1.16,s.owned[i]));function earn(n){s.money+=n;s.total+=n}function save(){s.time=Date.now();try{localStorage.setItem('mpol-empire-v1',JSON.stringify(s))}catch(e){}}let offline=Math.floor(Math.min(14400,Math.max(0,(Date.now()-s.time)/1000))*income());if(offline>0){earn(offline);$('notice').textContent='Пока тебя не было: +$'+fmt(offline)}function card(icon,name,desc,cost,id){return '<div class="card"><div class="art">'+icon+'</div><div class="info"><b>'+name+'</b><small>'+desc+'</small></div><button class="buy" id="'+id+'">$'+fmt(cost)+'</button></div>'}function build(){ $('shops').innerHTML=defs.map((d,i)=>card(d[1],d[0],'',''+price(i),'b'+i)).join('');defs.forEach((d,i)=>$('b'+i).onclick=()=>{let p=price(i);if(s.money>=p){s.money-=p;s.owned[i]++;save();render()}});$('upgrades').innerHTML=card('✦','Сила клика','',50,'u0')+card('↗','Доход бизнеса','',250,'u1');$('u0').onclick=()=>{let p=50*s.power*s.power;if(s.money>=p){s.money-=p;s.power++;save();render()}};$('u1').onclick=()=>{let p=250*s.mult*s.mult;if(s.money>=p){s.money-=p;s.mult++;save();render()}};$('city').innerHTML=defs.map(()=>'<div class="building"></div>').join('')}function render(){ $('money').textContent='$'+fmt(s.money);$('rate').textContent='+$'+fmt(income())+' / сек';$('power').textContent='+$'+s.power+' за нажатие';$('rank').textContent=s.total>=1e6?'Магнат':s.total>=10000?'Предприниматель':s.total>=500?'Бизнесмен':'Новичок';defs.forEach((d,i)=>{let b=$('b'+i);b.textContent='$'+fmt(price(i));b.disabled=s.money<price(i);b.previousElementSibling.querySelector('small').textContent='Ур. '+s.owned[i]+' · +$'+fmt(d[3]*s.mult)+'/сек';$('city').children[i].style.height=(s.owned[i]?25+Math.min(95,Math.log2(s.owned[i]+1)*18+i*6):5)+'px';$('city').children[i].style.opacity=s.owned[i]?1:.2});[50*s.power*s.power,250*s.mult*s.mult].forEach((p,i)=>{let b=$('u'+i);b.textContent='$'+fmt(p);b.disabled=s.money<p;b.previousElementSibling.querySelector('small').textContent=i?'Множитель ×'+s.mult+' → ×'+(s.mult+1):'Сила '+s.power+' → '+(s.power+1)});if(!$('stats').classList.contains('hidden'))$('achievements').innerHTML=[['Первый капитал',s.total,100],['Мастер кликов',s.clicks,500],['Владелец бизнеса',s.owned.reduce((a,b)=>a+b,0),20],['Миллионер',s.total,1e6]].map(([n,v,g])=>'<div class="card"><div class="info"><b>'+n+(v>=g?' ✓':'')+'</b><div class="progress"><i style="width:'+Math.min(100,v/g*100)+'%"></i></div><small>'+fmt(v)+' / '+fmt(g)+'</small></div></div>').join('')}build();render();$('tap').onclick=e=>{earn(s.power);s.clicks++;let f=document.createElement('span');f.className='float';f.textContent='+$'+s.power;let r=$('tap').getBoundingClientRect();f.style.left=(e.clientX||r.left+r.width/2)+'px';f.style.top=(e.clientY||r.top+r.height/2)+'px';document.body.append(f);setTimeout(()=>f.remove(),760);render();save()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>{x.classList.toggle('active',x===b);$(x.dataset.tab).classList.toggle('hidden',x!==b)});render()});let last=Date.now();setInterval(()=>{let now=Date.now();earn(income()*Math.min(14400,(now-last)/1000));last=now;render()},250);setInterval(save,3000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pagehide',save);</script><script>(()=>{const c=document.getElementById('view'),g=c.getContext('2d');if(!g)return;let yaw=.68,drag=false,px=0,startX=0,startY=0,moved=false,w=0,h=0,dpr=1,heights=defs.map(()=>0),lastFrame=0;const positions=[[-2,-1],[0,-1],[2,-1],[-2,1],[0,1],[2,1],[0,3]];function resize(){let r=c.getBoundingClientRect();dpr=Math.min(2,devicePixelRatio||1);w=r.width;h=r.height;c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);g.setTransform(dpr,0,0,dpr,0,0)}resize();window.addEventListener('resize',resize);c.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;startX=e.clientX;startY=e.clientY;moved=false;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag){if(Math.hypot(e.clientX-startX,e.clientY-startY)>7)moved=true;if(moved){yaw+=(e.clientX-px)*.009;px=e.clientX}}});c.addEventListener('pointerup',e=>{drag=false;if(moved)return;const rect=c.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;const hit=positions.some(([a,b],i)=>{const base=transform(a,0,b),top=transform(a,heights[i],b);return Math.abs(x-base.x)<w/13&&y>top.y-w/25&&y<base.y+w/19});if(hit){$('notice').textContent='Выбери свободное место на карте';return}$('tap').onclick(e)});c.addEventListener('pointercancel',()=>drag=false);function transform(x,y,z){let a=x*Math.cos(yaw)-z*Math.sin(yaw),b=x*Math.sin(yaw)+z*Math.cos(yaw),scale=Math.min(w/8.5,h/8);let perspective=1/(1+b*.025);return{x:w/2+a*scale*perspective,y:h*.53+(b*.48-y*.94)*scale*perspective,depth:b+y*.05}}function poly(points,color,stroke){g.beginPath();points.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.fillStyle=color;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=.7;g.stroke()}}function box(x,z,y,a,b,ht,colors,faces){let v=[[x-a,y,z-b],[x+a,y,z-b],[x+a,y,z+b],[x-a,y,z+b],[x-a,y+ht,z-b],[x+a,y+ht,z-b],[x+a,y+ht,z+b],[x-a,y+ht,z+b]].map(p=>transform(...p));let f=[[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7],[4,5,6,7]];f.forEach((ids,i)=>{let p=ids.map(j=>v[j]);let cross=(p[1].x-p[0].x)*(p[2].y-p[0].y)-(p[1].y-p[0].y)*(p[2].x-p[0].x);if(i!==4&&cross>=0)return;faces.push({p,depth:p.reduce((s,q)=>s+q.depth,0)/4,color:colors[i],roof:i===4})})}function frame(t){let dt=Math.min(.05,(t-lastFrame)/1000||.016);lastFrame=t;g.clearRect(0,0,w,h);let sky=g.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#16283f');sky.addColorStop(1,'#6d8794');g.fillStyle=sky;g.fillRect(0,0,w,h);let ground=[[-4,-3],[4,-3],[4,4],[-4,4]].map(p=>transform(p[0],0,p[1]));poly(ground,'#4a6962','#83a49a');for(let i=-3;i<=3;i++){let a=transform(i,0,-3),b=transform(i,0,4);g.strokeStyle='#ffffff18';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}for(let i=-2;i<=3;i++){let a=transform(-4,0,i),b=transform(4,0,i);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}let faces=[];for(const [tx,tz] of [[-3,-2.3],[3,-2.3],[-3,2.5],[3,2.5],[-1,3.5],[2,3.5]]){box(tx,tz,0,.07,.07,.38,['#76583f','#76583f','#76583f','#76583f','#96754c'],faces);box(tx,tz,.30,.23,.23,.48,['#477c54','#649764','#36664b','#51865b','#91b87c'],faces)}const road=[[-4,-.35],[4,-.35],[4,.35],[-4,.35]].map(p=>transform(p[0],.015,p[1]));poly(road,'#303945');for(let k=-3;k<4;k++){let a=transform(k,.025,0),b=transform(k+.45,.025,0);g.strokeStyle='#e7d5a1';g.lineWidth=1.3;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke()}positions.forEach(([x,z],i)=>{let target=.48+i*.16+Math.min(1.6,Math.log2(s.owned[i]+1)*.32);heights[i]+=(target-heights[i])*Math.min(1,dt*5);let ht=heights[i];const palettes=[['#b97c54','#dbad79','#9a6049','#bc8e63','#e6c29b'],['#517d89','#76a5ad','#395b71','#628f9d','#b9d1d0'],['#7d8994','#aab1ba','#626e7b','#8e9ca7','#d1d6da'],['#a57f68','#d3ae92','#82614f','#bd947a','#e6c7a7'],['#777f85','#a2a6a9','#555e66','#858c92','#c3c9cb'],['#426984','#70a6be','#2f506b','#537d9a','#a3ccdc'],['#526387','#8b9db9','#374969','#61799f','#c2d2e4']];box(x,z,0,.72,.65,ht,palettes[i],faces);box(x,z,ht,.45,.40,.09,['#5b6973','#82939d','#56616b','#798b96','#d2dce0'],faces);if(i===4)box(x+.4,z+.25,ht,.10,.10,.55,['#737d86','#b0b6ba','#59636d','#8c969d','#d5dadd'],faces);{for(let floor=.28;floor<ht-.12;floor+=.3){for(let k=-1;k<=1;k++){let a=k*.36;box(x+a,z-.658,floor,.09,.012,.12,['#ffd98c','#ae945d','#ffd98c','#ae945d','#e4c885'],faces);box(x+.728,z+a,floor,.012,.09,.12,['#ffd98c','#ae945d','#ffd98c','#ae945d','#e4c885'],faces);box(x+a,z+.658,floor,.09,.012,.12,['#ffd98c','#ae945d','#ffd98c','#ae945d','#e4c885'],faces);box(x-.728,z+a,floor,.012,.09,.12,['#ffd98c','#ae945d','#ffd98c','#ae945d','#e4c885'],faces)}}}});faces.sort((a,b)=>b.depth-a.depth);faces.forEach(f=>poly(f.p,f.color));if(income()>0){let a=transform(Math.sin(t*.001)*3,.12,0);g.fillStyle='#f5ca76';g.beginPath();g.arc(a.x,a.y,3,0,Math.PI*2);g.fill()}requestAnimationFrame(frame)}requestAnimationFrame(frame)})();</script><script>(()=>{const companies=['NOVA Tech','Atlas Motors','Green Energy','Skyline Group'];let selected=0;const data=companies.map((_,i)=>Array.from({length:48},(_,j)=>60+i*30+j*.5+Math.sin(j*.45+i)*7+Math.cos(j*.18)*5));const canvas=$('chart'),ctx=canvas.getContext('2d');function draw(){let a=data[selected],lo=Math.min(...a)-5,hi=Math.max(...a)+5;ctx.clearRect(0,0,640,300);ctx.strokeStyle='#304056';for(let y=30;y<300;y+=55){ctx.beginPath();ctx.moveTo(20,y);ctx.lineTo(620,y);ctx.stroke()}ctx.strokeStyle='#b7e88c';ctx.lineWidth=4;ctx.beginPath();a.forEach((v,i)=>{let x=20+i*600/(a.length-1),y=275-(v-lo)/(hi-lo)*250;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();$('marketname').textContent=companies[selected]+' · учебная цена $'+a.at(-1).toFixed(2);$('marketlist').innerHTML=companies.map((n,i)=>'<button class="marketrow '+(i===selected?'selected':'')+'" data-company="'+i+'"><b>'+n+'</b><span>$'+data[i].at(-1).toFixed(2)+'</span></button>').join('');$('marketlist').querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.company);draw()})}draw();setInterval(()=>{data.forEach((a,i)=>{a.push(Math.max(10,a.at(-1)+Math.sin(Date.now()/14000+i)*1.1));a.shift()});draw()},2000)})();</script><script>document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.querySelector('[data-tab="home"]').click());</script></body></html>
